plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.globalyds'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.globalyds"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // Kotlin & Architecture
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // Material Design Temel
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'

    // İkon & Tipografi
    implementation 'com.mikepenz:iconics-core:5.3.4'
    implementation 'com.mikepenz:google-material-typeface:4.0.0.2-kotlin@aar'
    implementation 'com.mikepenz:fontawesome-typeface:5.13.3.0-kotlin@aar'

    // Resim & Medya
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.makeramen:roundedimageview:2.3.0'

    // UI Bileşenleri Premium
    implementation 'com.afollestad.material-dialogs:core:3.3.0'
    implementation 'com.afollestad.material-dialogs:input:3.3.0'
    implementation 'com.afollestad.material-dialogs:color:3.3.0'
    implementation 'com.mikepenz:materialdrawer:9.0.1'
    implementation 'com.mikepenz:aboutlibraries:10.9.1'
    implementation 'com.github.AppIntro:AppIntro:6.3.1'
    implementation 'com.github.SimformSolutionsPvtLtd:SSBouncyBottomSheet:1.1.0'
    implementation 'com.github.Shashank02051997:FancyToast-Android:0.2.1'
    implementation 'com.github.faruktoptas:FancyShowCaseView:1.0.0'
    implementation 'com.github.ashik94vc:ElegantNumberButton:1.0.3'

    // Loading & Progress
    implementation 'com.github.leandroBorgesFerreira:LoadingButtonAndroid:2.3.2'
    implementation 'com.akexorcist:round-corner-progress-bar:2.2.1'
    implementation 'com.team.supercharge:shimmerlayout:2.1.0'
    implementation 'com.github.Faltenreich:SkeletonLayout:4.0.0'

    // Liste & Layout
    implementation 'com.github.chthai64:SwipeRevealLayout:1.4.1'
    implementation 'com.github.takusemba:multisnaprecyclerview:2.0.1'
    implementation 'com.github.Ramotion:cardslider-android:0.3.1'
    implementation 'com.github.yarolegovich:discrete-scrollview:1.5.1'

    // Form & Giriş
    implementation 'com.github.ChaosLeung:PinView:1.4.2'
    implementation 'com.hbb20:ccp:2.7.3'
    implementation 'com.github.prolificinteractive:material-calendarview:2.0.1'

    // PDF
    implementation 'com.github.barteksc:android-pdf-viewer:3.2.0-beta.1'

    // Google AdMob
    implementation 'com.google.android.gms:play-services-ads:22.6.0'

    // Firebase (BOM and Firestore)
    implementation platform('com.google.firebase:firebase-bom:32.7.1')
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-analytics'

    // Retrofit & Gson
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Lottie Animasyonları
    implementation 'com.airbnb.android:lottie:6.3.0'

    // Confetti (Başarı patlatması)
    implementation 'com.github.jinatonic.confetti:confetti:1.1.2'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
}
