plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.vocabmaster.app'
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.cynorra.vocabmaster.app"
        minSdk 24
        targetSdk 36
        versionCode 17
        versionName "2.1.3"
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Populated from CI env vars (GitHub Actions secrets) when building a signed release bundle.
    // Local debug builds never need these - signingConfigs.release is only touched by the
    // release build type, and bundleRelease/assembleRelease are meant to run in CI, not locally.
    def releaseStorePath = System.getenv("RELEASE_KEYSTORE_PATH")
    if (releaseStorePath != null) {
        signingConfigs {
            release {
                storeFile file(releaseStorePath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStorePath != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
    
    // UI & Material
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Room - KSP ile (Hızlı ve hafif)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Glide - KSP ile (Kapt'a gerek kalmadı)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    ksp 'com.github.bumptech.glide:ksp:4.16.0'

    // Firebase & Ads (Uyumlu versiyonlar)
    implementation platform('com.google.firebase:firebase-bom:33.1.1')
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.google.android.gms:play-services-ads:23.1.0'
    // GDPR/UK consent flow (User Messaging Platform). Wired into MainActivity but disabled by
    // default via GDPR_CONSENT_ENABLED - flip that flag on if Google flags a policy warning.
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'com.google.android.play:review-ktx:2.0.2'

    // Diğer Kütüphaneler (Tam liste)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.airbnb.android:lottie:6.3.0'
    implementation 'com.mikepenz:materialdrawer:9.0.1'
    implementation 'com.github.AppIntro:AppIntro:6.3.1'
    implementation 'com.mikepenz:iconics-core:5.3.4'
    implementation 'com.mikepenz:google-material-typeface:4.0.0.2-kotlin@aar'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.afollestad.material-dialogs:core:3.3.0'
    implementation 'com.github.Shashank02051997:FancyToast-Android:0.1.8'
    implementation 'com.github.faruktoptas:FancyShowCaseView:1.0.0'
    implementation 'com.github.ashik94vc:ElegantNumberButton:1.0.3'
    implementation 'com.github.leandroBorgesFerreira:LoadingButtonAndroid:1.12.1'
    implementation 'com.akexorcist:round-corner-progress-bar:2.2.1'
    implementation 'com.github.takusemba:multisnaprecyclerview:2.0.1'
    implementation 'io.github.chaosleung:pinview:1.4.4'
    implementation 'com.hbb20:ccp:2.7.3'
    implementation 'com.github.prolificinteractive:material-calendarview:2.0.1'
    implementation 'com.github.jinatonic.confetti:confetti:1.1.2'
    implementation 'jp.wasabeef:recyclerview-animators:4.0.2'
    implementation 'com.github.Chrisvin:LiquidSwipe:1.3'
    implementation 'com.getkeepsafe.taptargetview:taptargetview:1.13.3'

    // Unit tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'

    // Instrumented UI screenshot tour (CI-only design review aid, see ScreenshotTourTest)
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
