name: UI screenshot tour

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "Disposable Firebase test account email"
        required: true
      test_password:
        description: "Disposable Firebase test account password"
        required: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Free disk space
        run: |
          echo "Before:" && df -h /
          # Deliberately NOT touching $AGENT_TOOLSDIRECTORY (/opt/hostedtoolcache) -
          # that's where actions/setup-java just installed the JDK sdkmanager needs.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          echo "After:" && df -h /

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run screenshot tour on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            ./gradlew installDebug --no-daemon --stacktrace
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.TEST_EMAIL="${{ inputs.test_email }}" -Pandroid.testInstrumentationRunnerArguments.TEST_PASSWORD="${{ inputs.test_password }}"
            mkdir -p screenshots
            # Test writes to internal storage (filesDir), not external - it's always
            # available regardless of SD-card mount timing on a fresh CI emulator boot.
            # adb root lets us pull an app-private path directly. Use /data/user/0/<pkg>
            # rather than /data/data/<pkg> - adb pull doesn't follow the /data/data symlink
            # on this emulator image and reports ENOENT even though the files are there.
            adb root
            sleep 3
            adb wait-for-device
            adb pull /data/user/0/com.cynorra.vocabmaster.app/files/screens screenshots || true
            ls -la screenshots || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot-tour
          path: screenshots
          if-no-files-found: warn

      - name: Upload instrumentation test report (for debugging failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-test-report
          path: app/build/reports/androidTests
          if-no-files-found: ignore
